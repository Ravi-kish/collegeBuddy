spring:
  application:
    name: demo

  datasource:
    url: jdbc:mysql://localhost:3306/college_buddy?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Flyway owns the schema; never let Hibernate change it
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  error:
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-32-byte-minimum-secret}
    expiration-seconds: 3600
  login:
    max-failed-attempts: 5

logging:
  level:
    com.collegeBuddy.demo: DEBUG
